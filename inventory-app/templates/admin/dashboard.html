{% extends 'base.html' %}
{% block title %} &mdash; Admin Dashboard{% endblock %}
{% block content %}
<h4 class="fw-bold mb-4" style="color:var(--wel-primary);">
  <i class="bi bi-speedometer2"></i> Admin Dashboard
</h4>

<div id="liveDashboard" data-live-url="{{ url_for('admin_dashboard_fragment') }}">
{% include 'admin/_dashboard_stats.html' %}
</div>

<div class="row g-3 mt-1">
  <div class="col-md-6">
    <div class="card p-4">
      <h6 class="fw-semibold mb-3">Quick Actions</h6>
      <div class="d-grid gap-2">
        <a href="{{ url_for('upload_excel') }}" class="btn btn-iitb">
          <i class="bi bi-upload"></i> Upload Excel Inventory
        </a>
        <a href="{{ url_for('admin_requests') }}" class="btn btn-outline-warning">
          <i class="bi bi-list-check"></i> View All Requests
        </a>
        <a href="{{ url_for('admin_inventory') }}" class="btn btn-outline-secondary">
          <i class="bi bi-boxes"></i> Manage Inventory
        </a>
      </div>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card p-4">
      <h6 class="fw-semibold mb-3">Grant Admin Access</h6>
      <form method="POST" action="{{ url_for('make_admin') }}">
        <div class="mb-2">
          <input type="email" name="email" class="form-control"
                 placeholder="user@iitb.ac.in" required>
          <div class="form-text">User must have registered first.</div>
        </div>
        <button type="submit" class="btn btn-iitb">Make Admin</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
