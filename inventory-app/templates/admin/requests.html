{% extends 'base.html' %}
{% block title %} &mdash; Manage Requests{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3" style="color:var(--wel-primary);">
  <i class="bi bi-list-check"></i> Component Requests
</h4>

<div class="btn-group mb-4" role="group">
  <a href="{{ url_for('admin_requests', status='pending') }}"
     class="btn btn-sm {{ 'btn-warning text-dark' if status == 'pending' else 'btn-outline-warning' }}">
    Pending
  </a>
  <a href="{{ url_for('admin_requests', status='approved') }}"
     class="btn btn-sm {{ 'btn-success' if status == 'approved' else 'btn-outline-success' }}">
    Approved
  </a>
  <a href="{{ url_for('admin_requests', status='rejected') }}"
     class="btn btn-sm {{ 'btn-danger' if status == 'rejected' else 'btn-outline-danger' }}">
    Rejected
  </a>
</div>

<div id="liveRequests"
     data-live-url="{{ url_for('admin_requests_fragment', status=status) }}">
{% include 'admin/_requests_list.html' %}
</div>

{% endblock %}
