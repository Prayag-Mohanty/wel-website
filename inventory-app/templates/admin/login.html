{% extends 'base.html' %}
{% block title %} &mdash; Admin Login{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5 col-lg-4">
    <div class="card p-4 border-top border-warning border-4">
      <div class="text-center mb-4">
        <i class="bi bi-shield-lock-fill" style="font-size: 2.5rem; color: var(--wel-secondary);"></i>
        <h4 class="fw-bold mt-2" style="color: var(--wel-primary);">Admin Portal</h4>
        <p class="text-muted small">IITB WEL Inventory — Lab Team Access</p>
      </div>

      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Admin Email</label>
          <input type="email" name="email" class="form-control"
                 placeholder="admin@iitb.ac.in" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" name="password" class="form-control"
                 placeholder="Admin password" required>
        </div>
        <button type="submit" class="btn w-100 py-2 fw-semibold"
                style="background:var(--wel-secondary); color:#fff;">
          <i class="bi bi-shield-lock"></i> Login as Admin
        </button>
      </form>

      <hr class="my-3">
      <p class="text-center text-muted small mb-0">
        Student? <a href="{{ url_for('landing') }}">Go to Student Portal</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
