{% extends 'base.html' %}
{% block title %} &mdash; Login{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5 col-lg-4">
    <div class="card p-4">
      <div class="text-center mb-4">
        <i class="bi bi-cpu-fill" style="font-size: 2.5rem; color: var(--wel-primary);"></i>
        <h4 class="fw-bold mt-2" style="color: var(--wel-primary);">IITB WEL Inventory</h4>
        <p class="text-muted small">Sign in with your team's IITB account</p>
      </div>

      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">IITB Email</label>
          <input type="email" name="email" class="form-control" placeholder="rollno@iitb.ac.in"
                 autocomplete="email" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" name="password" class="form-control"
                 placeholder="Your team password" required>
        </div>
        <button type="submit" class="btn btn-iitb w-100 py-2 fw-semibold">
          <i class="bi bi-box-arrow-in-right"></i> Login
        </button>
      </form>

      <hr class="my-3">
      <p class="text-center text-muted small mb-0">
        New team? <a href="{{ url_for('register') }}">Register here</a>
      </p>
      <p class="text-center text-muted small mt-2 mb-0">
        Forgot password? Contact the lab administrator.
      </p>
    </div>
  </div>
</div>
{% endblock %}
