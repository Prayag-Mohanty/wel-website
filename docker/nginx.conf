server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Let /about resolve to /about.html as well as /about.html itself.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Images, CSS and JS all carry a ?v= stamp that changes when the file
    # changes, so they can be cached hard without ever going stale.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML must not be cached that way, or a rebuild would not be picked up.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    # Modest hardening for a page that runs only its own scripts.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
